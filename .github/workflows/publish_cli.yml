name: 🚀 Publish @uverify/cli to npm

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  publish:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release-please--branches--main')"
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: ⬆️ Ensure npm supports Trusted Publishing
        run: npm i -g npm@^11.5.1

      # Every release-please merge triggers this workflow, also when only the other package was released.
      - name: 🔎 Skip if this version is already on npm
        id: published
        working-directory: ./packages/cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@uverify/cli@$VERSION" version > /dev/null 2>&1; then
            echo "@uverify/cli@$VERSION is already published, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📦 Install Dependencies
        if: steps.published.outputs.exists != 'true'
        working-directory: ./packages/cli
        run: npm ci

      - name: 🛠️ Build the Project
        if: steps.published.outputs.exists != 'true'
        working-directory: ./packages/cli
        run: npm run build

      - name: 🚀 Publish to npm (OIDC only)
        if: steps.published.outputs.exists != 'true'
        working-directory: ./packages/cli
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --provenance --access public

      - name: ✅ Verify Published Package
        if: steps.published.outputs.exists != 'true'
        run: npm info @uverify/cli